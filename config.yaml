provider: local_qwen

providers:
  local_qwen:
    base_url: "http://127.0.0.1:8080/v1/"
    model: "qwen3-vl-8b" # qwen3-vl-8b-instruct-abliterated-v2.0-q4_k_m
    timeout: 600

generation:
  temperature: 1
  max_tokens: 2048
  top_p: 0.9
  presence_penalty: 1.0

system_prompt: >-
  You are a helpful local AI assistant.
  Always reply in Traditional Chinese when the user writes in Traditional Chinese.